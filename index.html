<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>しろつ｜作品一覧</title>
  <meta name="description" content="しろつの制作物（動くループ作品と画像）の一覧。">

  <!-- OGP: og:image はクローラ向けに絶対URLが望ましい。独自ドメイン確定後、絶対URLへ書き換えること。 -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="しろつ｜作品一覧">
  <meta property="og:description" content="しろつの制作物（動くループ作品と画像）の一覧。">
  <meta property="og:image" content="works/001-loop-aurora/poster.jpg">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <h1 class="site-title">しろつ</h1>
    <p class="site-intro">動くループ作品と画像をつくっています。</p>
  </header>

  <main>

    <!-- ================================================================
         カテゴリ = <section class="category">。見出しは <h2 class="category__label">。
         その中の <ul class="gallery"> に、作品の塊 <li><figure class="work"> を並べる。

         1作品（塊）の中身:
           <div class="work__media-group"> … 動画/画像を 1個以上 並べる … </div>
           <figcaption class="work__caption"> 作品タイトル </figcaption>

         メディア部品（コピペ用）:
         ▼ 動画
           <video class="work__media" poster="works/NNN-slug/poster.jpg"
                  width="480" height="270"
                  autoplay muted loop playsinline preload="metadata"
                  aria-label="作品名（動画）">
             <source src="works/NNN-slug/video.webm" type="video/webm">
             <source src="works/NNN-slug/video.mp4"  type="video/mp4">
           </video>
         ▼ 画像（複数なら image-1 / image-2 … と並べる）
           <picture>
             <source srcset="works/NNN-slug/image.webp" type="image/webp">
             <img class="work__media" src="works/NNN-slug/image.jpg"
                  width="480" height="270" loading="lazy" decoding="async"
                  alt="作品名（画像）">
           </picture>
         ================================================================ -->

    <section class="category">
      <h2 class="category__label">ゲーム作品</h2>
      <ul class="gallery" role="list">

        <!-- 動画 + 画像 の塊 -->
        <li>
          <figure class="work">
            <div class="work__media-group">
              <video class="work__media" poster="works/001-loop-aurora/poster.jpg"
                     width="480" height="270"
                     autoplay muted loop playsinline preload="metadata"
                     aria-label="オーロラの呼吸（動画）">
                <source src="works/001-loop-aurora/video.webm" type="video/webm">
                <source src="works/001-loop-aurora/video.mp4"  type="video/mp4">
              </video>
              <picture>
                <source srcset="works/001-loop-aurora/image.webp" type="image/webp">
                <img class="work__media" src="works/001-loop-aurora/image.jpg"
                     width="480" height="270" loading="lazy" decoding="async"
                     alt="オーロラの呼吸（画像）">
              </picture>
            </div>
            <figcaption class="work__caption">オーロラの呼吸</figcaption>
          </figure>
        </li>

        <!-- 動画のみ の塊 -->
        <li>
          <figure class="work">
            <div class="work__media-group">
              <video class="work__media" poster="works/002-loop-bloom/poster.jpg"
                     width="480" height="270"
                     autoplay muted loop playsinline preload="metadata"
                     aria-label="開花のループ（動画）">
                <source src="works/002-loop-bloom/video.webm" type="video/webm">
                <source src="works/002-loop-bloom/video.mp4"  type="video/mp4">
              </video>
            </div>
            <figcaption class="work__caption">開花のループ</figcaption>
          </figure>
        </li>

        <!-- 動画 + 画像 の塊 -->
        <li>
          <figure class="work">
            <div class="work__media-group">
              <video class="work__media" poster="works/003-loop-circuit/poster.jpg"
                     width="480" height="270"
                     autoplay muted loop playsinline preload="metadata"
                     aria-label="回路の鼓動（動画）">
                <source src="works/003-loop-circuit/video.webm" type="video/webm">
                <source src="works/003-loop-circuit/video.mp4"  type="video/mp4">
              </video>
              <picture>
                <source srcset="works/003-loop-circuit/image.webp" type="image/webp">
                <img class="work__media" src="works/003-loop-circuit/image.jpg"
                     width="480" height="270" loading="lazy" decoding="async"
                     alt="回路の鼓動（画像）">
              </picture>
            </div>
            <figcaption class="work__caption">回路の鼓動</figcaption>
          </figure>
        </li>

        <!-- 動画のみ の塊 -->
        <li>
          <figure class="work">
            <div class="work__media-group">
              <video class="work__media" poster="works/004-loop-drift/poster.jpg"
                     width="480" height="270"
                     autoplay muted loop playsinline preload="metadata"
                     aria-label="漂流（動画）">
                <source src="works/004-loop-drift/video.webm" type="video/webm">
                <source src="works/004-loop-drift/video.mp4"  type="video/mp4">
              </video>
            </div>
            <figcaption class="work__caption">漂流</figcaption>
          </figure>
        </li>

      </ul>
    </section>

    <section class="category">
      <h2 class="category__label">VRChat ワールド制作</h2>
      <ul class="gallery" role="list">

        <!-- 動画 + 画像×2 の塊（複数画像の例） -->
        <li>
          <figure class="work">
            <div class="work__media-group">
              <video class="work__media" poster="works/005-loop-ember/poster.jpg"
                     width="480" height="270"
                     autoplay muted loop playsinline preload="metadata"
                     aria-label="残り火（動画）">
                <source src="works/005-loop-ember/video.webm" type="video/webm">
                <source src="works/005-loop-ember/video.mp4"  type="video/mp4">
              </video>
              <picture>
                <source srcset="works/005-loop-ember/image-1.webp" type="image/webp">
                <img class="work__media" src="works/005-loop-ember/image-1.jpg"
                     width="480" height="270" loading="lazy" decoding="async"
                     alt="残り火（画像1）">
              </picture>
              <picture>
                <source srcset="works/005-loop-ember/image-2.webp" type="image/webp">
                <img class="work__media" src="works/005-loop-ember/image-2.jpg"
                     width="480" height="270" loading="lazy" decoding="async"
                     alt="残り火（画像2）">
              </picture>
            </div>
            <figcaption class="work__caption">残り火</figcaption>
          </figure>
        </li>

        <!-- 動画 + 画像 の塊 -->
        <li>
          <figure class="work">
            <div class="work__media-group">
              <video class="work__media" poster="works/006-loop-flux/poster.jpg"
                     width="480" height="270"
                     autoplay muted loop playsinline preload="metadata"
                     aria-label="ゆらぎ（動画）">
                <source src="works/006-loop-flux/video.webm" type="video/webm">
                <source src="works/006-loop-flux/video.mp4"  type="video/mp4">
              </video>
              <picture>
                <source srcset="works/006-loop-flux/image.webp" type="image/webp">
                <img class="work__media" src="works/006-loop-flux/image.jpg"
                     width="480" height="270" loading="lazy" decoding="async"
                     alt="ゆらぎ（画像）">
              </picture>
            </div>
            <figcaption class="work__caption">ゆらぎ</figcaption>
          </figure>
        </li>

        <!-- 動画のみ の塊 -->
        <li>
          <figure class="work">
            <div class="work__media-group">
              <video class="work__media" poster="works/007-loop-glow/poster.jpg"
                     width="480" height="270"
                     autoplay muted loop playsinline preload="metadata"
                     aria-label="微光（動画）">
                <source src="works/007-loop-glow/video.webm" type="video/webm">
                <source src="works/007-loop-glow/video.mp4"  type="video/mp4">
              </video>
            </div>
            <figcaption class="work__caption">微光</figcaption>
          </figure>
        </li>

        <!-- 動画のみ の塊 -->
        <li>
          <figure class="work">
            <div class="work__media-group">
              <video class="work__media" poster="works/008-loop-halo/poster.jpg"
                     width="480" height="270"
                     autoplay muted loop playsinline preload="metadata"
                     aria-label="光輪（動画）">
                <source src="works/008-loop-halo/video.webm" type="video/webm">
                <source src="works/008-loop-halo/video.mp4"  type="video/mp4">
              </video>
            </div>
            <figcaption class="work__caption">光輪</figcaption>
          </figure>
        </li>

        <!-- 動画のみ の塊 -->
        <li>
          <figure class="work">
            <div class="work__media-group">
              <video class="work__media" poster="works/009-loop-iris/poster.jpg"
                     width="480" height="270"
                     autoplay muted loop playsinline preload="metadata"
                     aria-label="虹彩（動画）">
                <source src="works/009-loop-iris/video.webm" type="video/webm">
                <source src="works/009-loop-iris/video.mp4"  type="video/mp4">
              </video>
            </div>
            <figcaption class="work__caption">虹彩</figcaption>
          </figure>
        </li>

      </ul>
    </section>

    <section class="category">
      <h2 class="category__label">その他</h2>
      <ul class="gallery" role="list">

        <!-- 画像のみ の塊 -->
        <li>
          <figure class="work">
            <div class="work__media-group">
              <picture>
                <source srcset="works/010-still-jade/image.webp" type="image/webp">
                <img class="work__media" src="works/010-still-jade/image.jpg"
                     width="480" height="270" loading="lazy" decoding="async"
                     alt="翡翠">
              </picture>
            </div>
            <figcaption class="work__caption">翡翠</figcaption>
          </figure>
        </li>

        <!-- 画像のみ の塊 -->
        <li>
          <figure class="work">
            <div class="work__media-group">
              <picture>
                <source srcset="works/011-still-koi/image.webp" type="image/webp">
                <img class="work__media" src="works/011-still-koi/image.jpg"
                     width="480" height="270" loading="lazy" decoding="async"
                     alt="鯉">
              </picture>
            </div>
            <figcaption class="work__caption">鯉</figcaption>
          </figure>
        </li>

        <!-- 画像のみ の塊 -->
        <li>
          <figure class="work">
            <div class="work__media-group">
              <picture>
                <source srcset="works/012-still-lumen/image.webp" type="image/webp">
                <img class="work__media" src="works/012-still-lumen/image.jpg"
                     width="480" height="270" loading="lazy" decoding="async"
                     alt="ルーメン">
              </picture>
            </div>
            <figcaption class="work__caption">ルーメン</figcaption>
          </figure>
        </li>

      </ul>
    </section>

  </main>

  <script src="main.js"></script>
</body>
</html>
