         works/ フォルダの内容から再生成されます。手編集も可能です。

         構造:
           カテゴリ = <section class="category"> + <h2 class="category__label">
           作品の塊 = <li><figure class="work">
             <div class="work__media-group"> … 動画/画像を1個以上 …
             <figcaption class="work__caption"> caption.txt の1行目 …

         パスの注意: フォルダ名に半角スペースは使わない（パスは日本語そのままでOK）。
           見出しの表示名を別テキストにしたい場合のみ、カテゴリ直下に _label.txt を置く
           （例: works/VRChatワールド制作/_label.txt = "VRChat ワールド制作"）

         メディア部品（コピペ用）:
         ▼ 動画
           <video class="work__media" poster="works/CAT/NNN-slug/poster.jpg"
                  width="480" height="270"
                  autoplay muted loop playsinline preload="metadata"
                  aria-label="作品名（動画）">
             <source src="works/CAT/NNN-slug/video.webm" type="video/webm">
             <source src="works/CAT/NNN-slug/video.mp4"  type="video/mp4">
           </video>
         ▼ 画像（複数なら image-1 / image-2 … と並べる）
           <picture>
             <source srcset="works/CAT/NNN-slug/image.webp" type="image/webp">
             <img class="work__media" src="works/CAT/NNN-slug/image.jpg"
                  width="480" height="270" loading="lazy" decoding="async"
                  alt="作品名（画像）">
           </picture>
         ================================================================ -->
